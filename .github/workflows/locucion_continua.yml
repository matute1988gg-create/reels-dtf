name: Locucion Master Continua

on:
  workflow_dispatch:

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install edge-tts
      - name: Generar locucion continua
        run: |
          python -c '
          import asyncio
          import edge_tts

          VOZ = "es-AR-TomasNeural"
          VELOCIDAD = "+8%"

          guion = (
              "¿Querés hacer una remera con la foto de tu mascota, pero no querés una simple foto cuadrada aburrida? "
              "Nos mandás su foto y la idea que tengas en mente: te armamos un diseño exclusivo desde cero, en el estilo que más te guste. "
              "Te entregamos el archivo en alta definición con el semitono profesional listo para mandar a tu imprenta. "
              "Colores vivos, líneas nítidas y caída suave, sin parches duros de tinta. "
              "Escribinos por WhatsApp con tu foto y cotizamos tu diseño hoy mismo."
          )

          asyncio.run(edge_tts.Communicate(guion, VOZ, rate=VELOCIDAD).save("locucion_personalizados.mp3"))
          print("Locución generada con éxito.")
          '
      - uses: actions/upload-artifact@v4
        with:
          name: locucion_personalizados_artifact
          path: locucion_personalizados.mp3
