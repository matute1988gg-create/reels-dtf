name: Locucion Master Continua

on:
  workflow_dispatch:

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install edge-tts
      - name: Generar locucion continua
        run: |
          python -c '
          import asyncio
          import edge_tts

          VOZ = "es-AR-TomasNeural"
          VELOCIDAD = "+8%"

          guion = (
              "¿Querés hacer un semitono DTF perfecto? Te muestro el paso a paso exacto que uso en mi taller. "
              "Entrás a dtf-arg.com, cargás tu imagen y lo primero: le das a Mejorar Resolución para rescatar detalles. "
              "Seleccionás prenda negra y activás Semitono Profesional: el negro de la tela reemplaza la tinta. "
              "Activás la Corrección de Cobertura y calibrás el Punto Mínimo para que tu plancha no pierda puntos finos. "
              "Le das a Generar Semitono y listo: tenés el archivo con caída suave y cero acartonado. "
              "Entrá a dtf-arg.com y probalo gratis ahora mismo."
          )

          asyncio.run(edge_tts.Communicate(guion, VOZ, rate=VELOCIDAD).save("locucion_tutorial_app.mp3"))
          print("Locución generada con éxito.")
          '
      - uses: actions/upload-artifact@v4
        with:
          name: locucion_tutorial_app_artifact
          path: locucion_tutorial_app.mp3
