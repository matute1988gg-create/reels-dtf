name: Locucion Master Continua

on:
  workflow_dispatch:

jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install edge-tts
      - name: Generar locucion continua
        run: |
          python -c '
          import asyncio
          import edge_tts

          VOZ = "es-AR-TomasNeural"
          VELOCIDAD = "+9%"

          guion = (
              "¿Te pidieron una remera con una foto fea, pixelada o sacada de internet? "
              "No pierdas la venta: nos la mandás, recuperamos el diseño desde cero y lo dejamos en alta calidad. "
              "Te entregamos el archivo en PNG transparente a trescientos DPI, listo para mandar a tu imprenta. "
              "Vos no tenés que diseñar ni renegar: solo mandás a imprimir y planchás directo en tu remera. "
              "Mirá la definición en la prenda: los colores quedan vivos y las líneas súper nítidas. "
              "El semitono divide los puntos exactos para lograr sombras y luces perfectas. "
              "Rescatamos cada detalle para que el diseño se funda natural con el tejido. "
              "Cero calco rígido o acartonado. La estampa queda con caída suave, flexible y transpirable. "
              "El servicio sale cinco mil pesos por diseño y te lo entregamos listo en el día. "
              "Mandanos esa foto que querés recuperar por WhatsApp y tenela lista hoy mismo."
          )

          asyncio.run(edge_tts.Communicate(guion, VOZ, rate=VELOCIDAD).save("locucion_completa.mp3"))
          print("Locución generada con éxito.")
          '
      - uses: actions/upload-artifact@v4
        with:
          name: locucion_master_continua
          path: locucion_completa.mp3