<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel DTF - Pochola RIP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap');

:root {
  --bg-obsidian: #07090f;
  --bg-panel: #0d1220;
  --bg-surface: rgba(20, 26, 46, 0.75);
  --ember: #ff8a3d;
  --ember-glow: rgba(255, 138, 61, 0.35);
  --ember-gold: #ffb347;
  --success: #3ddc97;
  --cyan-subtle: #4dabf7;
  --text-white: #ffffff;
  --text-slate: #9aa3b8;
  --text-muted: #5b6478;
  --border-subtle: rgba(255, 255, 255, 0.10);
  --border-ember: rgba(255, 138, 61, 0.45);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1080px; height: 1920px; overflow: hidden;
  background: var(--bg-obsidian);
  font-family: 'Inter', -apple-system, sans-serif;
  color: var(--text-white);
}

#escena {
  position: relative; width: 1080px; height: 1920px; overflow: hidden;
  background: radial-gradient(circle at 50% 25%, #141a2e 0%, #0d1220 50%, #07090f 100%);
}

/* Fondo Halftone Matrix sutil característico de Pochola RIP */
#halftone-bg {
  position: absolute; inset: 0;
  background-image: radial-gradient(rgba(255, 138, 61, 0.12) 1.5px, transparent 1.5px),
                    radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
  background-size: 40px 40px, 16px 16px;
  background-position: 0 0, 20px 20px;
}
#vineta {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(7, 9, 15, 0.85) 100%);
}

/* Header de Marca persistente */
#brand-header {
  position: absolute; top: 60px; left: 70px; right: 70px; height: 100px;
  display: flex; align-items: center; justify-content: space-between;
  z-index: 10;
}
.logo-container {
  display: flex; align-items: center; gap: 20px;
}
.brand-img {
  width: 90px; height: 90px; border-radius: 50%;
  border: 3px solid var(--ember);
  box-shadow: 0 0 25px var(--ember-glow);
  background: #000;
  object-fit: cover;
}
.brand-names {
  display: flex; flex-direction: column;
}
.brand-title {
  font-family: 'Anton', sans-serif; font-size: 38px; letter-spacing: 2px;
  color: var(--text-white); line-height: 1; text-transform: uppercase;
}
.brand-title span { color: var(--ember); }
.brand-badge {
  font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700;
  color: var(--text-slate); letter-spacing: 3px; text-transform: uppercase; margin-top: 4px;
}
.pill-status {
  background: rgba(61, 220, 151, 0.12);
  border: 1px solid var(--success);
  color: var(--success);
  padding: 10px 22px; border-radius: 30px;
  font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700;
  display: flex; align-items: center; gap: 10px;
}
.pill-status::before {
  content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--success);
  box-shadow: 0 0 10px var(--success);
}

/* Palabras animadas estilo Hormozi / TikTok dinámico */
.w {
  display: inline-block; font-size: 78px; font-weight: 900; line-height: 1.15;
  color: #fff; text-shadow: 0 4px 20px rgba(0,0,0,0.8); opacity: 0;
}
.w.y {
  color: var(--ember-gold);
  text-shadow: 0 0 35px var(--ember-glow), 0 4px 20px rgba(0,0,0,0.9);
}
.w.t {
  font-family: 'Anton', sans-serif;
  font-size: 96px; font-weight: 400; letter-spacing: 1px;
  text-transform: uppercase; line-height: 1.05;
}

/* Subtítulos destacados arriba */
#sub {
  position: absolute; left: 60px; right: 60px; top: 190px; height: 260px;
  z-index: 5;
}
.subgrupo {
  position: absolute; inset: 0; display: flex; flex-wrap: wrap; justify-content: center;
  align-content: center; gap: 0 18px; opacity: 0; text-align: center;
}

/* Pantalla de Intro / Gancho potente */
#intro {
  position: absolute; inset: 0; opacity: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 0 70px;
}
#kicker {
  font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 700;
  letter-spacing: 8px; color: var(--ember); text-transform: uppercase;
  background: rgba(255, 138, 61, 0.1); border: 1px solid var(--ember);
  padding: 12px 32px; border-radius: 40px; margin-bottom: 50px;
}
#titulo {
  display: flex; flex-wrap: wrap; justify-content: center; align-content: center;
  gap: 0 24px; text-align: center; max-width: 950px;
}
#barra {
  width: 320px; height: 8px; border-radius: 4px;
  background: linear-gradient(90deg, var(--ember), var(--ember-gold));
  box-shadow: 0 0 25px var(--ember);
  margin-top: 60px; transform-origin: center center;
}

/* Badge circular del paso actual */
#badge {
  position: absolute; left: 70px; top: 480px; width: 140px; height: 140px;
  border-radius: 50%; border: 4px solid var(--ember);
  background: var(--bg-surface); backdrop-filter: blur(12px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 20px var(--ember-glow);
  display: flex; align-items: center; justify-content: center;
  color: var(--ember-gold); font-family: 'Anton', sans-serif; font-size: 64px;
  opacity: 0; z-index: 10;
}

/* Ilustración técnica de la prenda (SVG) */
#svg {
  position: absolute; left: 90px; top: 460px; overflow: visible; z-index: 2;
}

/* Píldora inferior de especificación técnica / medida */
#pill {
  position: absolute; left: 80px; right: 80px; top: 1540px; height: 150px;
  border-radius: 30px;
  border: 2px solid var(--ember);
  background: linear-gradient(180deg, rgba(20, 26, 46, 0.95), rgba(13, 18, 32, 0.98));
  box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 30px var(--ember-glow);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 80px; font-weight: 700;
  letter-spacing: 2px; opacity: 0; z-index: 10;
}

/* Placa final de Resumen / "Lo Importante" */
#resumen {
  position: absolute; left: 70px; right: 70px; top: 460px; padding: 60px 50px 45px;
  border-radius: 36px;
  background: rgba(13, 18, 32, 0.96);
  border: 2px solid var(--ember);
  box-shadow: 0 30px 90px rgba(0,0,0,0.8), 0 0 45px var(--ember-glow);
  opacity: 0; z-index: 15;
}
#r-titulo {
  text-align: center; font-family: 'Anton', sans-serif; font-size: 54px; letter-spacing: 4px;
  color: var(--ember); margin-bottom: 45px; text-transform: uppercase;
}
.linea {
  display: flex; align-items: center; gap: 26px; margin-bottom: 32px;
  font-size: 44px; font-weight: 700; line-height: 1.25; color: #fff; opacity: 0;
}
.chk {
  flex: 0 0 68px; height: 68px; border-radius: 50%;
  background: linear-gradient(135deg, var(--ember), var(--ember-gold));
  box-shadow: 0 0 20px var(--ember-glow);
  display: flex; align-items: center; justify-content: center;
}
.guardar {
  display: flex; justify-content: center; align-items: center; gap: 20px;
  font-size: 46px; font-weight: 800; color: var(--ember-gold); margin-top: 40px;
  font-family: 'Inter', sans-serif;
}

/* Footer inferior permanente */
#marca {
  position: absolute; left: 0; right: 0; bottom: 55px; text-align: center;
  font-family: 'JetBrains Mono', monospace; font-size: 34px; font-weight: 700;
  letter-spacing: 4px; color: var(--text-slate); z-index: 10;
}
#marca span { color: var(--ember); }

/* Pantalla Outro final */
#outro {
  position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 40px; z-index: 30;
  background: radial-gradient(circle at center, #141a2e 0%, #07090f 100%);
}
.o-logo {
  width: 220px; height: 220px; border-radius: 50%;
  border: 6px solid var(--ember);
  box-shadow: 0 0 60px var(--ember-glow);
  margin-bottom: 20px; opacity: 0;
}
#o-marca {
  font-family: 'Anton', sans-serif; font-size: 92px; color: #fff; letter-spacing: 3px;
  text-transform: uppercase; opacity: 0; text-align: center;
}
#o-marca span { color: var(--ember); }
#o-tag {
  font-family: 'JetBrains Mono', monospace; font-size: 36px; font-weight: 700;
  color: var(--ember-gold); letter-spacing: 6px; text-transform: uppercase; opacity: 0;
}
#o-cta {
  font-size: 38px; color: var(--text-slate); opacity: 0; margin-top: 20px;
  font-family: 'Inter', sans-serif;
}
</style>
</head>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const easeBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const set = (el, o) => { for (const k in o) el.setAttribute(k, o[k]); };

  let D = null;
  const subGrupos = [];
  let titWords = [];
  let resLineas = [];

  function mkWords(cont, texto, extra) {
    const spans = [];
    texto.split(/(\*[^*]+\*)/).forEach(seg => {
      if (!seg) return;
      const amar = seg.length > 2 && seg.startsWith('*') && seg.endsWith('*');
      const limpio = amar ? seg.slice(1, -1) : seg;
      limpio.split(/\s+/).filter(Boolean).forEach(w => {
        const s = document.createElement('span');
        s.className = 'w' + (amar ? ' y' : '') + (extra ? ' ' + extra : '');
        s.textContent = w;
        cont.appendChild(s);
        spans.push(s);
      });
    });
    return spans;
  }

  function dimsDe(m) {
    const r = /(\d+(?:[.,]\d+)?)\s*[x×X]\s*(\d+(?:[.,]\d+)?)/.exec(m || '');
    if (!r) return null;
    const u = (/(cm|mm|pulg|in)/i.exec(m) || [])[1] || 'cm';
    return [r[1] + ' ' + u, r[2] + ' ' + u];
  }

  window.setData = function (d) {
    D = d;
    d.pasos.forEach(p => {
      const g = document.createElement('div');
      g.className = 'subgrupo';
      $('sub').appendChild(g);
      subGrupos.push({ el: g, words: mkWords(g, p.subtitulo_destacado) });
    });
    titWords = mkWords($('titulo'), d.titulo.replace(/\*/g, ''), 't');
    if (titWords.length) titWords[titWords.length - 1].classList.add('y');
    resLineas = d.resumen_final.map(txt => {
      const row = document.createElement('div');
      row.className = 'linea';
      row.innerHTML = '<div class="chk"><svg viewBox="0 0 24 24" width="38" height="38"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#07090f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lt"></div>';
      row.lastChild.textContent = txt;
      $('lineas').appendChild(row);
      return row;
    });
  };

  function dimAncho(p, label) {
    const g = $('dAncho');
    g.style.opacity = p > 0 ? 1 : 0;
    if (p <= 0) return;
    const x1 = 400 - 150 * p, x2 = 400 + 150 * p, y = 870, pe = clamp(p * 1.5);
    set($('aL'), { x1: x1 + 20, x2: x2 - 20, y1: y, y2: y });
    set($('aFi'), { points: `${x1},${y} ${x1 + 26},${y - 12} ${x1 + 26},${y + 12}` });
    set($('aFd'), { points: `${x2},${y} ${x2 - 26},${y - 12} ${x2 - 26},${y + 12}` });
    set($('aEi'), { y2: 815 + 80 * pe });
    set($('aEd'), { y2: 815 + 80 * pe });
    const t = $('aT'); t.textContent = label; t.style.opacity = clamp((p - 0.6) / 0.4);
  }

  function dimLargo(p, label) {
    const g = $('dLargo');
    g.style.opacity = p > 0 ? 1 : 0;
    if (p <= 0) return;
    const x = 760, y1 = 465 - 345 * p, y2 = 465 + 345 * p, pe = clamp(p * 1.5);
    set($('lL'), { x1: x, x2: x, y1: y1 + 20, y2: y2 - 20 });
    set($('lFi'), { points: `${x},${y1} ${x - 12},${y1 + 26} ${x + 12},${y1 + 26}` });
    set($('lFd'), { points: `${x},${y2} ${x - 12},${y2 - 26} ${x + 12},${y2 - 26}` });
    set($('lEi'), { x2: 480 + 305 * pe });
    set($('lEd'), { x2: 560 + 225 * pe });
    const t = $('lT'); t.textContent = label; t.style.opacity = clamp((p - 0.6) / 0.4);
  }

  function animEstampa(p, isLogo) {
    const gEstampa = $('estampa');
    const gLogo = $('logoPecho');
    if (isLogo) {
      gEstampa.style.opacity = 0;
      gLogo.style.opacity = p > 0 ? clamp(p * 1.5) : 0;
      const sc = 0.85 + 0.15 * p;
      gLogo.setAttribute('transform', `translate(500 310) scale(${sc}) translate(-500 -310)`);
    } else {
      gLogo.style.opacity = 0;
      gEstampa.style.opacity = p > 0 ? clamp(p * 1.5) : 0;
      const sc = 0.85 + 0.15 * p;
      gEstampa.setAttribute('transform', `translate(400 370) scale(${sc}) translate(-400 -370)`);
    }
  }

  window.renderAtTime = function (t) {
    if (!D) return;
    const P = D.pasos, n = P.length;
    const enIntro = t < D.intro.fin;
    const enOutro = t >= D.outro.inicio;
    let idx = -1;
    if (!enIntro) {
      if (enOutro) idx = n - 1;
      else { idx = P.findIndex(p => t >= p.inicio && t < p.fin); if (idx < 0) idx = n - 1; }
    }
    const paso = idx >= 0 ? P[idx] : null;
    const lt = paso ? t - paso.inicio : 0;
    const tipo = paso ? paso.tipo_animacion : '';
    const badgeTxt = paso ? paso.etiqueta_badge.toUpperCase() : '';
    const isLogo = badgeTxt.includes('LOGO') || (paso && paso.subtitulo_destacado.toLowerCase().includes('pecho'));

    // intro (gancho)
    $('intro').style.opacity = enIntro ? 1 - clamp((t - (D.intro.fin - 0.35)) / 0.35) : 0;
    if (enIntro) {
      const dur = D.intro.duracion_audio;
      titWords.forEach((w, k) => {
        const ts = 0.08 + k * (dur * 0.75 / titWords.length);
        const a = easeOut(clamp((t - ts) / 0.25));
        w.style.opacity = a;
        w.style.transform = `translateY(${(1 - a) * 35}px)`;
      });
      $('barra').style.transform = `scaleX(${easeOut(clamp((t - 0.15) / 0.7))})`;
    }

    // silueta de remera
    const s = clamp((t - (D.intro.fin - 0.4)) / 0.4);
    let shirtOp = 0.15 + 0.85 * s;
    if (tipo === 'resumen') shirtOp = 1 - 0.92 * easeOut(clamp(lt / 0.4));
    $('svg').style.opacity = shirtOp;

    // subtítulos palabra por palabra
    subGrupos.forEach((g, i) => {
      if (i !== idx || enOutro) { g.el.style.opacity = 0; return; }
      const p = P[i];
      g.el.style.opacity = clamp((p.fin - t) / 0.15);
      g.words.forEach((w, k) => {
        const ts = 0.08 + k * (p.duracion_audio * 0.72 / g.words.length);
        const a = easeOut(clamp((lt - ts) / 0.18));
        w.style.opacity = a;
        w.style.transform = `translateY(${(1 - a) * 24}px) scale(${0.94 + 0.06 * a})`;
      });
    });

    // badge y medida principal
    const badge = $('badge'), pill = $('pill');
    if (paso && !enOutro && tipo !== 'resumen') {
      badge.textContent = paso.etiqueta_badge;
      const L = paso.etiqueta_badge.length;
      badge.style.fontSize = (L <= 2 ? 64 : L === 3 ? 50 : 36) + 'px';
      badge.style.opacity = clamp(lt / 0.15);
      badge.style.transform = `scale(${easeBack(clamp(lt / 0.35))})`;
      pill.textContent = paso.medida_principal;
      pill.style.fontSize = (paso.medida_principal.length > 14 ? 62 : 82) + 'px';
      pill.style.opacity = clamp((lt - 0.5) / 0.15);
      pill.style.transform = `scale(${easeBack(clamp((lt - 0.5) / 0.35))})`;
    } else {
      badge.style.opacity = 0;
      pill.style.opacity = 0;
    }

    // ilustración precisa según paso
    const dims = paso ? dimsDe(paso.medida_principal) : null;
    const pAn = easeOut(clamp((lt - 0.2) / 1.0));
    dimAncho(tipo === 'ancho' && !isLogo ? pAn : 0, dims ? dims[0] : 'ANCHO');
    dimLargo(tipo === 'largo' ? pAn : 0, dims ? dims[1] : 'LARGO');
    animEstampa(tipo === 'estampa' || isLogo ? easeOut(clamp((lt - 0.2) / 0.8)) : 0, isLogo);

    // tarjeta resumen
    const rs = $('resumen');
    const rp = tipo === 'resumen' ? easeOut(clamp(lt / 0.4)) : 0;
    rs.style.opacity = rp;
    rs.style.transform = `translateY(${(1 - rp) * 35}px)`;
    if (rp > 0) {
      const gap = Math.max(0.2, Math.min(0.4, (paso.duracion_audio - 0.8) / (resLineas.length + 1)));
      resLineas.forEach((row, j) => {
        const a = easeOut(clamp((lt - 0.4 - j * gap) / 0.25));
        row.style.opacity = a;
        row.style.transform = `translateX(${(1 - a) * -50}px)`;
      });
      $('g-icono').style.transform = `scale(${1 + 0.08 * Math.sin(2 * Math.PI * 1.2 * t)})`;
    }

    // outro final
    const lo = t - D.outro.inicio;
    const op = enOutro ? easeOut(clamp(lo / 0.4)) : 0;
    $('outro').style.opacity = op;
    $('marca').style.opacity = 1 - op;
    if (enOutro) {
      const pop = (el, t0) => {
        const a = clamp((lo - t0) / 0.25);
        el.style.opacity = a;
        el.style.transform = `translateY(${(1 - easeOut(a)) * 25}px)`;
      };
      pop($('o-logo'), 0.15);
      pop($('o-marca'), 0.4);
      pop($('o-tag'), 0.7);
      pop($('o-cta'), 1.0);
    }
  };
})();
</script>
</body>
</html>
